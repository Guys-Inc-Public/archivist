name: 'Archivist'
description: 'Build a signed apt repository from a directory of .deb files and publish it to S3-compatible storage.'
author: 'Guys Inc'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  packages:
    description: 'Directory containing the .deb files to publish.'
    required: true
  config:
    description: 'Path to the archivist configuration file.'
    required: false
    default: 'archivist.yml'
  bucket:
    description: 'Destination bucket name.'
    required: true
  endpoint:
    description: 'S3-compatible endpoint URL. Defaults to Amazon S3 when unset.'
    required: false
  version:
    description: 'Version of archivist to use. Pin this in production.'
    required: false
    default: 'latest'
  dry-run:
    description: 'Build and verify the repository, but upload nothing.'
    required: false
    default: 'false'

outputs:
  repository-url:
    description: 'Public URL of the published repository.'
    value: ${{ steps.publish.outputs.repository-url }}
  install-snippet:
    description: 'Ready-to-paste apt install instructions, with the key fingerprint filled in.'
    value: ${{ steps.publish.outputs.install-snippet }}

# This wrapper deliberately contains no logic. Everything it does is a call into
# the CLI, so that every behaviour is reachable - and testable - without pushing
# a commit. See CONTRIBUTING.md.
#
# Every input reaches the shell through `env:`, never through `${{ }}`
# interpolation inside `run:`. A templated input is substituted into the script
# before bash ever sees it, so a value containing shell metacharacters executes
# on the runner of whoever uses this action. Passing through the environment
# means bash treats the value as data.
runs:
  using: composite
  steps:
    - name: Install archivist
      shell: bash
      env:
        ARCHIVIST_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/install.sh"

    - name: Build repository
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        archivist build "$PACKAGES" \
          --config "$CONFIG" \
          --out "${RUNNER_TEMP}/archivist-repo"

    - name: Publish repository
      id: publish
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        # Built as an array rather than a string, so no value is ever re-split.
        args=( "${RUNNER_TEMP}/archivist-repo" --bucket "$BUCKET" )
        if [ -n "$ENDPOINT" ]; then
          args+=( --endpoint "$ENDPOINT" )
        fi
        if [ "$DRY_RUN" = "true" ]; then
          args+=( --dry-run )
        fi

        archivist publish "${args[@]}" --github-output
