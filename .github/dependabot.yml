version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "go"]
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      actions-all:
        patterns: ["*"]

  # The composite Action pins its own actions independently of the root workflows.
  - package-ecosystem: github-actions
    directory: /action
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
