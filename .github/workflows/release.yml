name: Release

# A packaging tool that ships unsigned binaries is a bad joke. Every release is
# signed, carries an SBOM, and records a public build-provenance attestation.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and sign, but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # mint the short-lived Sigstore identity
      attestations: write   # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # goreleaser needs full history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Import release signing subkey
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          # Fail loudly if the secret holds usable private material for a key that
          # can certify. Only a signing subkey belongs in CI - see docs/Signing-Keys.md.
          #
          # Capability alone is not the test. `gpg --export-secret-subkeys` leaves a
          # gnu-dummy stub of the primary in the export, so a correct CI key and a
          # full secret key BOTH report caps=cSC in field 12. Field 15 is what
          # separates them: "#" means no secret material present, "+" means there is.
          # Checking only field 12 rejects every correctly-prepared key.
          if gpg --batch --list-secret-keys --with-colons \
            | awk -F: '$1=="sec" && $12 ~ /c/ && $15 != "#" {found=1} END{exit !found}'; then
            echo "::error::The imported secret key carries private material for a certify-capable key. CI must hold a signing subkey only."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          # A dry run that skips signing does not exercise the step most likely to
          # break, which is how a passphrase-protected key reached this workflow
          # unnoticed. Skip publishing only.
          args: ${{ inputs.dry-run && 'release --clean --snapshot --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          # Always defined, even when empty: GoReleaser fails template expansion
          # on an absent .Env key, so an unset secret would break the build
          # rather than simply signing without a passphrase.
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Attest build provenance
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish job summary
        run: |
          {
            echo "### Release artifacts"
            echo
            echo '```'
            ls -la dist/ | sed -n '2,100p'
            echo '```'
            echo
            echo "Verify provenance with:"
            echo '```console'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
