name: Sync labels

# Labels are part of the repository standard, not per-repo improvisation. The
# set lives in .github/labels.yml and this workflow makes the repository match.

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml', '.github/workflows/sync-labels.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Apply label set
    runs-on: ubuntu-latest
    permissions:
      contents: read   # a job-level permissions block zeroes every scope it omits
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
          token: ${{ secrets.GITHUB_TOKEN }}
