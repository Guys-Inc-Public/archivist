name: Publish wiki

# docs/ in this repository is the single source of truth. The wiki is a
# generated, read-only mirror: it is rebuilt on every merge to main, so any edit
# made directly in the wiki is discarded. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror docs/ to the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      # A repository's wiki git remote does not exist until its first page has
      # been created, and there is no API to create one. Checking out with
      # actions/checkout would fail here with "Repository not found", which
      # sends the reader looking for a permissions problem that isn't there.
      - name: Checkout wiki
        id: wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if git clone --quiet "$remote" wiki 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Wiki not initialised"
            echo
            echo "This repository's wiki has never been opened, so its git remote does not"
            echo "exist yet and there is no API to create one."
            echo
            echo "**One-time fix:** open"
            echo "<https://github.com/${GITHUB_REPOSITORY}/wiki> and save any page."
            echo "Re-run this workflow afterwards and it will take over from there."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Wiki not initialised - see the job summary. Skipping."

      - name: Render docs into wiki pages
        if: steps.wiki.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Clear the mirror, preserving git metadata, so deletions propagate.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          python3 repo/.github/wiki/render.py repo/docs wiki "$GITHUB_REPOSITORY"

          # Navigation furniture, copied verbatim - see .github/wiki/README.md.
          cp repo/.github/wiki/_Sidebar.md repo/.github/wiki/_Footer.md wiki/

          # Appended, not templated: the banner must survive Home.md being rewritten.
          {
            printf '\n---\n\n'
            printf '<sub>This wiki is generated from '
            printf '<a href="https://github.com/%s/tree/main/docs"><code>docs/</code></a> ' "$GITHUB_REPOSITORY"
            printf 'and is rebuilt on every merge to <code>main</code>. '
            printf 'Edits made here are overwritten \xe2\x80\x94 open a pull request against '
            printf '<code>docs/</code> instead.</sub>\n'
          } >> wiki/Home.md

      - name: Commit and push
        if: steps.wiki.outputs.ready == 'true'
        working-directory: wiki
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA:0:7}"
          git push
