name: Publish wiki

# docs/ in this repository is the single source of truth. The wiki is a
# generated, read-only mirror: it is rebuilt on every merge to main, so any edit
# made directly in the wiki is discarded. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror docs/ to the wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false

      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render docs into wiki pages
        run: |
          set -euo pipefail
          # Clear the mirror, preserving git metadata, so deletions propagate.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          python3 repo/.github/wiki/render.py repo/docs wiki "$GITHUB_REPOSITORY"

          # Navigation furniture, copied verbatim - see .github/wiki/README.md.
          cp repo/.github/wiki/_Sidebar.md repo/.github/wiki/_Footer.md wiki/

          # Appended, not templated: the banner must survive Home.md being rewritten.
          {
            printf '\n---\n\n'
            printf '<sub>This wiki is generated from '
            printf '<a href="https://github.com/%s/tree/main/docs"><code>docs/</code></a> ' "$GITHUB_REPOSITORY"
            printf 'and is rebuilt on every merge to <code>main</code>. '
            printf 'Edits made here are overwritten \xe2\x80\x94 open a pull request against '
            printf '<code>docs/</code> instead.</sub>\n'
          } >> wiki/Home.md

      - name: Commit and push
        working-directory: wiki
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA:0:7}"
          git push
